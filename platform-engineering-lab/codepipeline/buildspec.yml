version: 0.2
phases:
  install: { runtime-versions: { nodejs: 22 } }
  pre_build: { commands: ["cd platform-engineering-lab/services/inference-api", "npm ci", "npm test"] }
  build: { commands: ["docker build -t $REPOSITORY_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION .", "docker push $REPOSITORY_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION"] }
artifacts: { files: ["**/*"], discard-paths: no }
