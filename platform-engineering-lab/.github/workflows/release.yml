name: release
on: { workflow_dispatch: {}, push: { tags: ['v*.*.*'] } }
permissions: { id-token: write, contents: read }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - { uses: actions/checkout@v4 }
      - { uses: aws-actions/configure-aws-credentials@v4, with: { role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}, aws-region: ${{ vars.AWS_REGION }} } }
      - { uses: aws-actions/amazon-ecr-login@v2 }
      - { uses: docker/build-push-action@v6, with: { context: platform-engineering-lab/services/inference-api, push: true, tags: ${{ vars.ECR_REPOSITORY }}:${{ github.sha }} } }
      - { uses: anchore/sbom-action@v0, with: { image: ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}, artifact-name: sbom.spdx.json, output-file: sbom.spdx.json } }
