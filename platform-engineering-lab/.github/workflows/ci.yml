name: ci
on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform-engineering-lab/services/inference-api } }
    steps:
      - { uses: actions/checkout@v4 }
      - { uses: actions/setup-node@v4, with: { node-version: 22, cache: npm, cache-dependency-path: platform-engineering-lab/services/inference-api/package-lock.json } }
      - { run: npm install }
      - { run: npm test }
      - { uses: aquasecurity/trivy-action@0.24.0, with: { scan-type: fs, scan-ref: ., severity: CRITICAL,HIGH, exit-code: 1 } }
