AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Event-driven worker with DLQ, encryption, and CloudWatch alarms.
Globals: { Function: { Timeout: 30, MemorySize: 512, Runtime: nodejs22.x, Tracing: Active } }
Resources:
  WorkerDLQ: { Type: AWS::SQS::Queue, Properties: { MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true } }
  Worker: { Type: AWS::Serverless::Function, Properties: { CodeUri: ../services/worker, Handler: index.handler, ReservedConcurrentExecutions: 10, Policies: [AWSLambdaBasicExecutionRole, { SQSSendMessagePolicy: { QueueName: !GetAtt WorkerDLQ.QueueName } }], Events: { Api: { Type: Api, Properties: { Path: /worker, Method: post } } } } }
  Errors: { Type: AWS::CloudWatch::Alarm, Properties: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref Worker }], Statistic: Sum, Period: 300, EvaluationPeriods: 1, Threshold: 1, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: notBreaching } }
Outputs: { WorkerArn: { Value: !GetAtt Worker.Arn }, DLQUrl: { Value: !Ref WorkerDLQ } }
